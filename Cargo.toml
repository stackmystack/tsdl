[workspace]

members = []

[package]
authors = ["Firas al-Khalil <firasalkhalil@gmail.com>"]
build = "build.rs"
description = "A downloader/builder of many tree-sitter parsers"
edition = "2024"
name = "tsdl"
version = "3.0.0" # managed by release.sh
license = "MIT"

[lib]
name = "tsdl"
path = "src/lib.rs"

[[bin]]
name = "tsdl"
path = "src/main.rs"

[package.metadata.tsdl]
build-dir = "tmp"
cache-file = "cache.toml"
config-file = "parsers.toml"
force = false
fresh = false
from = "https://github.com/tree-sitter/tree-sitter-"
lock-file = "tsdl.lock"
log-file = "log"
out-dir = "parsers"
prefix = "libtree-sitter-"
ref = "master"
show-config = false
sys = false
unlock-timeout = 10

[package.metadata.tree-sitter]
# TODO: make it accept true git refs. For now it only uses versions.
version = "0.26.5"
repo = "https://github.com/tree-sitter/tree-sitter"

[dependencies]
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
better-panic = "0.3"
clap = { version = "4.6", features = ["cargo", "derive", "env"] }
clap-verbosity-flag = "3.0"
console = "0.16"
crossterm = "0.29"
derive_more = { version = "2", features = ["display"] }
fs2 = "0.4"
futures = "0.3"
libc = "0.2"
human-panic = "2.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "macros"] }
log = "0.4"
num_cpus = "1.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha1 = "0.11"
self_update = { version = "0.44", default-features = false, features = [
  "compression-flate2",
  "reqwest",
  "rustls",
] }
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
sysinfo = "0.39"
tempfile = "3"
tokio = { version = "1", features = [
  "fs",
  "macros",
  "process",
  "signal",
  "sync",
  "time",
] }
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = "0.3"
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
anyhow = "1"
assert_cmd = "2"
assert_fs = "1"
indoc = "2"
predicates = "3"
pretty_assertions = "1"
rstest = "0.26"

[build-dependencies]
cargo_metadata = "0.23"
const-str = "1"
indoc = "2"
serde_json = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing-errors-doc = "allow"
